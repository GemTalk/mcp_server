name: Health Check

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint GitHub Actions workflows
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Run actionlint
        run: docker run --rm -v "$(pwd)":/repo --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # 1.7.12
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  test:
    name: ubuntu-latest / GemStone ${{ matrix.gemstone-version }} (${{ matrix.install }})${{ matrix.grail && ' + Grail' || '' }}
    runs-on: ubuntu-latest
    # The Grail leg clones GemTalk/Grail and builds its CPython shim on top of the ordinary
    # install; the other legs stay fast, so give the matrix a shared ceiling generous enough for
    # the slower one rather than branching the timeout too. Measured: plain ~1m40s, Grail ~2m20s.
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        # Two audiences, two ways in -- see install.sh:
        #
        #   install: file-out  the 3.7.x audience, which runs the stock extent0.dbf and has no
        #                      Rowan. The leg exports the Tonel as one topaz file-out with
        #                      export-gs.sh -- the same file a release publishes -- and installs it
        #                      with install.sh --from-gs into a stock extent. Both supported 3.7
        #                      releases are covered, on every pull request, so a change that reaches
        #                      for something newer than 3.7.5 fails where it was made rather than
        #                      at the next release.
        #   install: rowan     the 4.0 audience, and how the project is developed: a Rowan 3 extent
        #                      (extent0.rowan3.dbf, which 4.0.0.a8 ships), loading the project from
        #                      this checkout. `grail: true` clones GemTalk/Grail (see below) and adds
        #                      --grail, the only way to exercise the Grail component -- and Grail
        #                      needs 4.0, so the Grail leg is a 4.0 leg.
        #
        # Listed one leg at a time rather than crossed, because the axes are not independent: no
        # 3.7 leg can carry Grail (Grail dropped 3.7.x on 2026-09-12 and its install_base.sh refuses
        # one), and a 3.7 leg is the file-out leg by design.
        #
        # download-base is where each version's Linux build is published. These differ, and the
        # difference is not incidental: 3.7.x is a released product on GemTalk's public download
        # server, while a 4.0 alpha is a pre-release that is NOT there. It is published on
        # dl.gemdb.com alongside GemDB's engine catalog, which is also where anything running this
        # server on 4.0 gets its engine, so testing against that host tests what users actually
        # install. Carried as matrix data rather than a `case` in the step below, so a version is
        # one line in one place and a job cannot silently download the wrong thing.
        #
        # THE ALPHA DIRECTORY IS NOT AN ARCHIVE -- or was not. dl.gemdb.com kept one alpha at a
        # time through 4.0.0.a3: on 2026-09-16 4.0.0.a2 replaced 4.0.0.Alpha1 and the Alpha1
        # directory began answering 404, which breaks this leg at the download rather than at
        # anything testable. a3, a4 and a5 were all listed on 2026-10-18, but by 2026-10-27 only
        # a5 and a8 were -- so do not count on an old one staying. Note the spelling changed too --
        # `Alpha1` to a lowercase `a2` -- so the next one cannot be guessed by incrementing this
        # one; read it off the catalog.
        include:
          - gemstone-version: '3.7.5'
            download-base: 'https://downloads.gemtalksystems.com/pub/GemStone64/3.7.5'
            install: file-out
            grail: false
          - gemstone-version: '3.7.6'
            download-base: 'https://downloads.gemtalksystems.com/pub/GemStone64/3.7.6'
            install: file-out
            grail: false
          - gemstone-version: '4.0.0.a8'
            download-base: 'https://dl.gemdb.com/4.0.0.a8'
            install: rowan
            grail: false
          - gemstone-version: '4.0.0.a8'
            download-base: 'https://dl.gemdb.com/4.0.0.a8'
            install: rowan
            grail: true
    env:
      GEMSTONE_VERSION: ${{ matrix.gemstone-version }}
      # Through the environment rather than straight into the `run` block, so nothing from the
      # matrix is ever expanded into a shell command's text.
      GEMSTONE_DOWNLOAD_BASE: ${{ matrix.download-base }}
      INSTALL_FROM: ${{ matrix.install }}
    steps:
      - name: Check out mcp_server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cloned into its own directory so it never lands in this repo's working tree. Tracks
      # Grail's default branch rather than a pinned commit -- see the job comment above; if an
      # upstream Grail change ever breaks this leg, pin `ref:` here to the last known-good commit
      # while it gets sorted out upstream.
      - name: Check out Grail
        if: matrix.grail
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GemTalk/Grail
          path: grail
          persist-credentials: false

      - name: Cache GemStone download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: downloads
          key: gemstone-${{ matrix.gemstone-version }}-x86_64-linux

      - name: Download and install GemStone
        run: |
          FILENAME="GemStone64Bit${GEMSTONE_VERSION}-x86_64.Linux.zip"
          mkdir -p downloads
          if [ ! -f "downloads/$FILENAME" ]; then
            curl -fL --progress-bar -o "downloads/$FILENAME" \
              "${GEMSTONE_DOWNLOAD_BASE}/${FILENAME}"
          fi
          mkdir -p "$HOME/gemstone"
          unzip -q "downloads/$FILENAME" -d "$HOME/gemstone"
          echo "GEMSTONE=$HOME/gemstone/GemStone64Bit${GEMSTONE_VERSION}-x86_64.Linux" >> "$GITHUB_ENV"

      - name: Configure environment
        run: |
          echo "GEMSTONE_GLOBAL_DIR=$GEMSTONE/global" >> "$GITHUB_ENV"
          echo "$GEMSTONE/bin" >> "$GITHUB_PATH"

      # GemStone ships pristine extents under bin/ as templates; copydbf instantiates the actual
      # database from one. Which one is the leg's whole point: the stock extent0.dbf for a file-out
      # leg -- the image a 3.7.x installation without Rowan runs on -- and extent0.rowan3.dbf for a
      # Rowan leg. Either is copied to data/extent0.dbf, the name the product's own
      # data/system.conf gives the stone. The stone also expects its lock/log directories to
      # already exist at first start.
      #
      # The key file: a stone with no KEYFILE configured looks for sys/gemstone.key, which no
      # download ships. Through 4.0.0.a2 it then fell back to the bundled
      # sys/community.starter.key; from 4.0.0.a3 it does not, and dies at startup with "Unable to
      # stat() key file .../sys/gemstone.key" -- a3's own system.conf says the starter key "must
      # be added to the configuration file". So name it there whenever there is no gemstone.key.
      # Guarded by existence rather than by version: 3.7.5 takes the line too, naming the same key
      # it would have fallen back to, and an image that ships its own key is left alone.
      - name: Create a fresh extent
        run: |
          mkdir -p "$GEMSTONE_GLOBAL_DIR/locks" "$GEMSTONE_GLOBAL_DIR/log" "$GEMSTONE/data"
          case "$INSTALL_FROM" in
            rowan)    EXTENT=extent0.rowan3.dbf ;;
            file-out) EXTENT=extent0.dbf ;;
            *) echo "unknown install mode '$INSTALL_FROM'" >&2; exit 1 ;;
          esac
          copydbf "$GEMSTONE/bin/$EXTENT" "$GEMSTONE/data/extent0.dbf"
          chmod 600 "$GEMSTONE/data/extent0.dbf"
          if [ ! -f "$GEMSTONE/sys/gemstone.key" ] && [ -f "$GEMSTONE/sys/community.starter.key" ]; then
            echo "KEYFILE = $GEMSTONE/sys/community.starter.key;" >> "$GEMSTONE/data/system.conf"
          fi

      - name: Start Stone and NetLDI
        run: |
          startstone gs64stone
          startnetldi -g -a "$USER" gs64ldi

      # Grail needs a C toolchain to build its CPython shim (src/c/shim), on top of the stone
      # this job already started. install_base.sh (once per extent, as SystemUser) then
      # install.sh (per user, as the DataCurator ./install.sh itself logs in as) are Grail's own
      # two-step install -- see https://github.com/GemTalk/Grail#installation. The login line
      # matches install.sh's own GS_STONE/GS_USER/GS_PASS defaults, since this job never
      # overrides them.
      - name: Install Grail
        if: matrix.grail
        run: |
          # `|| true`: the runner image's own third-party apt sources (e.g. dl.google.com's
          # Chrome repo) can fail an index refresh with an unrelated Hash Sum mismatch, which
          # apt-get update reports as a nonzero exit even though the Ubuntu archives we actually
          # need (build-essential lives in main) refreshed fine. Failing here would blame Grail
          # for a flaky, unrelated repo on the runner image.
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends build-essential
          echo "set user DataCurator pass swordfish gems gs64stone" > ~/.topazini
          cd grail
          ./install_base.sh
          ./install.sh

      # Every script starts topaz with -i, so no .topazini reaches it. Plant the worst one in the
      # repository root -- where the scripts cd, and where topaz looks before $HOME -- and leave it
      # for the rest of the job: its login makes a script's own login fail with ERROR 2147, and its
      # output push hides everything that follows. Planted after Grail, whose scripts run from
      # grail/ and depend on the ~/.topazini written above.
      - name: Plant a .topazini the scripts must ignore
        run: |
          {
            echo "set gemstone gs64stone user DataCurator pass swordfish"
            echo "login"
            echo "output push $RUNNER_TEMP/topazini.out only"
          } > .topazini

      # Exported by this leg's own product tree. Which tree exports it does not matter -- 3.7.5,
      # 3.7.6 and 4.0.0.a5 write byte-identical files from the same Tonel (export-gs.sh) -- so this
      # is the file a release would publish from this commit.
      - name: Export the topaz file-out
        if: matrix.install == 'file-out'
        run: ./export-gs.sh "$RUNNER_TEMP/mcp_server.gs"

      - name: Install mcp_server from the file-out
        if: matrix.install == 'file-out'
        run: ./install.sh --from-gs "$RUNNER_TEMP/mcp_server.gs"

      - name: Install mcp_server through Rowan
        if: matrix.install == 'rowan'
        run: ./install.sh${{ matrix.grail && ' --grail' || '' }}

      - name: Run unit tests
        # McpGrailToolsetTest resolves by class name once installed, so this only matters on the
        # Grail leg -- but it is harmless to leave unset on the other one, see run-unit-tests.sh.
        env:
          MCP_GRAIL_DIR: ${{ matrix.grail && format('{0}/grail', github.workspace) || '' }}
        run: ./run-unit-tests.sh

      - name: Run wire-level integration test
        run: ./test.sh

      - name: Run wire-level integration test over TLS
        run: ./test-tls.sh

      # A script whose topaz read the planted .topazini wrote this file, even if it went on to pass.
      - name: Check that no topaz read the planted .topazini
        run: |
          if [ -e "$RUNNER_TEMP/topazini.out" ]; then
            echo "a topaz login read .topazini (missing -i):" >&2
            cat "$RUNNER_TEMP/topazini.out" >&2
            exit 1
          fi

      - name: Stop Stone and NetLDI
        if: always()
        run: |
          stopnetldi gs64ldi || true
          echo swordfish | stopstone gs64stone DataCurator -i || true

  all-checks-passed:
    name: "All Checks Passed"
    needs: [lint-workflows, test]
    # This is the only check the ruleset requires, and GitHub counts a skipped required check as
    # passing. Without always() a failed dependency skips this job and the merge queue merges anyway.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "lint-workflows: ${{ needs.lint-workflows.result }}, test: ${{ needs.test.result }}"
          exit 1
      - name: Success
        run: echo "All required checks have completed successfully!"
